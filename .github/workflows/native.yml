name: Legacy Godot builds (manual archive)

# Historical clients can be built on demand as GitHub artifacts. They are no longer
# published to the website; public distribution is the Windows Unity ZIP only.
on:
  workflow_dispatch:

concurrency:
  group: native-builds
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install the pinned engine and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Build Windows and macOS
        run: GODOT_PATH=godot node tools/build-native.mjs --platform=all --out=dist/native
      - name: Name the artifacts by source revision
        run: |
          HASH="${GITHUB_SHA::12}"
          mkdir -p dist/publish
          mv "dist/native/Shattered Empires Native.exe" "dist/publish/ShatteredEmpires-${HASH}-Windows-x64.exe"
          mv "dist/native/Shattered Empires Native.zip" "dist/publish/ShatteredEmpires-${HASH}-macOS-universal.zip"
          echo "BUILD=$HASH" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ env.BUILD }}
          path: dist/publish/*
          if-no-files-found: error

