name: Native client checks

on:
  pull_request:
    paths: ['godot/**', 'server/**', 'tools/art/**', '.github/workflows/godot-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install pinned native engine
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip /tmp/godot.zip -d /tmp/godot-bin
          sudo install /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and compile
        run: godot --headless --editor --path godot --quit
      - name: Native regression checks
        run: |
          godot --headless --path godot -s res://tests/render_regressions.gd
          godot --headless --path godot -s res://tests/composition_regressions.gd
          godot --headless --path godot -s res://tests/lwe_regressions.gd
          godot --headless --path godot -s res://tests/development_regressions.gd
          godot --headless --path godot -s res://tests/surface_fields_regressions.gd
          godot --headless --path godot -s res://tests/water_weather_regressions.gd
      - name: Live commands and reconnect
        run: |
          node godot/tests/lwe-live.mjs
          node godot/tests/lwe-live.mjs --ui
          node godot/tests/network-smoke.mjs
