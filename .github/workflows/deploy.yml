name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE: shattered-empires
  REGION: ${{ vars.GCP_REGION || 'us-east1' }}
  PROJECT: ${{ vars.GCP_PROJECT }}
  REPOSITORY: shattered-empires

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation (set up by infra/bootstrap.sh).
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # New Workload Identity bindings can take a few minutes to propagate; wait for impersonation to work.
      - name: Wait for deployer impersonation
        run: |
          for i in $(seq 1 12); do
            if gcloud auth print-access-token >/dev/null 2>&1; then echo "Impersonation OK"; exit 0; fi
            echo "Deployer service account not yet usable (attempt $i/12); IAM may still be propagating..."
            sleep 20
          done
          echo "::error::GitHub could not impersonate ${{ vars.GCP_DEPLOY_SA }}. Re-run infra/bootstrap.sh and check the roles/iam.workloadIdentityUser binding for repository ${{ github.repository }}."
          gcloud auth print-access-token

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          for i in 1 2 3; do docker push "$IMAGE" && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --session-affinity \
            --timeout 3600 \
            --cpu 2 --memory 1Gi \
            --no-cpu-throttling --cpu-boost \
            --min-instances 0 --max-instances 1 \
            --concurrency 250 \
            --set-env-vars "APP_VERSION=${GITHUB_SHA::12},MAX_MATCHES=24" \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "### Shattered Empires is live: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/health -w '%{http_code}' "$URL/api/health")
            if [ "$CODE" = 200 ]; then cat /tmp/health; exit 0; fi
            echo "attempt $i: HTTP $CODE"; cat /tmp/health; echo
            sleep 3
          done
          if [ "$CODE" = 403 ]; then echo "::error::Cloud Run returned 403: the service is not publicly accessible. Your organization policy may block allUsers; see README."; fi
          exit 1
